name: Serve a small local LLM over tunnel.gg (ephemeral)

# Spin up Ollama on the GitHub runner and expose it via tunnel.gg, so PocketRun
# can talk to a local (CPU) model. The job lives for up to 6 hours.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model"
        required: false
        default: "qwen2.5:0.5b"

permissions:
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama + pull model
        run: |
          set -e
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull "${{ inputs.model }}"
          echo "=== model ready ==="

      - name: Expose over tunnel.gg
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -t -R 80:localhost:11434 proxy.tunnl.gg > /tmp/tunnel.log 2>&1 &
          sleep 12
          echo "========== TUNNEL URL =========="
          cat /tmp/tunnel.log
          echo "==============================="
          echo "Paste the URL into PocketRun: ⚙ -> baseUrl, then add /v1."
          echo "Model name to enter in the app: ${{ inputs.model }}"
          # stay alive as long as GitHub allows
          sleep 20000